  <main class="container my-4">
    <h2>Kalenteri</h2>
    <label for="kalenteri" class="visually-hidden">Valitse päivä</label>
    <input id="kalenteri" class="visually-hidden" type="text">
    <p id="varausTila" class="mt-3" role="status" aria-live="polite">Valitse päivä nähdäksesi sen luokkavaraukset.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/fi.js"></script>
<script>
  // näyttää varaukset valitulle päivälle
    const reservationStatus = document.querySelector("#varausTila");
    let reservations = [];

    async function haeVaraukset() {
        try {
            const response = await fetch("varaukset.php?hae=1");

                // virheilmoitus
            if (!response.ok) {
                throw new Error("Varausten hakeminen epäonnistui.");
            }

            const data = await response.json();
              // tarkistetaan, että data on taulukossa
            if (!Array.isArray(data)) {
              // jos data ei ole taulukossa, heitetään virhe
                throw new Error("Virheelliset varaustiedot.");
            }
              // tallennetaan varaukset
            reservations = data;
        } catch (error) {
          // näytetään virheilmoitus
            reservationStatus.textContent = "Varausten hakeminen epäonnistui.";
        }
    }

    // näyttää varaukset valitulle päivälle
    async function naytaVaraukset(dateString) {
        await haeVaraukset();

        // suodatetaan varaukset valitulle päivälle
        const paivanVaraukset = reservations.filter(
            varaus => varaus.date === dateString
        );
            // jos varauksia ei ole, näytetään ilmoitus
        if (paivanVaraukset.length === 0) {
            reservationStatus.textContent =
                `Päivälle ${dateString} ei ole luokkavarauksia.`;
            return;
        }

        paivanVaraukset.sort((a, b) =>
            Number(a.room) - Number(b.room) ||
            a.start.localeCompare(b.start)
        );

        const tiedot = paivanVaraukset.map(
            varaus => `Luokka ${varaus.room}, ${varaus.start}–${varaus.end}`
        );

        reservationStatus.textContent =
            `Päivän ${dateString} varaukset: ${tiedot.join("; ")}.`;
    }
    // alustetaan kalenteri
    flatpickr("#kalenteri", {
        inline: true,
        minDate: "today",
        dateFormat: "d.m.Y",
        locale: "fi",
        onChange: (selectedDates, dateString) => {
            if (dateString) {
                naytaVaraukset(dateString);
            }
        }
    });
      // haetaan varaukset heti sivun latautuessa
    haeVaraukset();
</script>
