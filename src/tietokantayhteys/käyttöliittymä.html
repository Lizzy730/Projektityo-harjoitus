  <main class="container my-4">
    <h2>Kalenteri</h2>
    <label for="kalenteri" class="visually-hidden">Valitse päivä</label>
    <input id="kalenteri" class="visually-hidden" type="text">
    <p id="varausTila" class="mt-3" role="status" aria-live="polite">Valitse päivä nähdäksesi sen luokkavaraukset.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/fi.js"></script>
  <script>
    const reservationStatus = document.querySelector("#varausTila");
    const storageKey = "luokkavaraus-varaukset";
    const legacyStorageKey = "luokkavaraus-varatut-paivat";
    let reservations = [];
    let storageAvailable = true;

    function validReservation(reservation) {
      return reservation && typeof reservation.id === "string" &&
        typeof reservation.date === "string" &&
        Number.isInteger(Number(reservation.room)) && Number(reservation.room) >= 1 && Number(reservation.room) <= 10 &&
        typeof reservation.start === "string" && typeof reservation.end === "string" &&
        /^\d{2}:00$/.test(reservation.start) && /^\d{2}:00$/.test(reservation.end) &&
        Number(reservation.start.slice(0, 2)) < Number(reservation.end.slice(0, 2)) &&
        Number(reservation.end.slice(0, 2)) <= 24;
    }

    function readReservations() {
      const stored = localStorage.getItem(storageKey);
      if (stored !== null) {
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed) || !parsed.every(validReservation)) {
          throw new Error("Varaustiedot eivät ole kelvollisia.");
        }
        return parsed;
      }

      const legacy = localStorage.getItem(legacyStorageKey);
      if (legacy === null) {
        return [];
      }
      const oldDates = JSON.parse(legacy);
      if (!Array.isArray(oldDates) || !oldDates.every(day => typeof day === "string")) {
        throw new Error("Aiemmat varaustiedot eivät ole kelvollisia.");
      }
      return oldDates.map((date, index) => ({
        id: `vanha-${index}-${date}`,
        date,
        room: 1,
        start: "00:00",
        end: "24:00"
      }));
    }

    try {
      reservations = readReservations();
    } catch (error) {
      storageAvailable = false;
      reservationStatus.textContent = "Varaustietojen lukeminen epäonnistui. Tarkista selaimen tallennustila ja tiedot.";
      reservationStatus.classList.add("text-danger");
    }

    flatpickr("#kalenteri", {
      inline: true,
      minDate: "today",
      dateFormat: "d.m.Y",
      locale: "fi",
      onChange: (selectedDates, dateString) => {
        if (!storageAvailable || !dateString) {
          return;
        }
        const dayReservations = reservations.filter(reservation => reservation.date === dateString);
        if (dayReservations.length === 0) {
          reservationStatus.textContent = `Päivälle ${dateString} ei ole luokkavarauksia.`;
          return;
        }
        const details = dayReservations
          .sort((a, b) => Number(a.room) - Number(b.room) || a.start.localeCompare(b.start))
          .map(reservation => `Luokka ${reservation.room}, ${reservation.start}–${reservation.end}`);
        reservationStatus.textContent = `Päivän ${dateString} varaukset: ${details.join("; ")}.`;
      }
    });
  </script>
