<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekisteröidy tai kirjaudu – Luokkavaraus</title>
  <link rel="stylesheet" href="käyttöliittymä.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <h1 class="text-center mt-4">Luokkavaraus</h1>
  <main class="container my-4" style="max-width: 640px;">
    <h2 id="rekisteroidy">Rekisteröidy</h2>
    <form id="rekisterointiLomake">
      <div class="mb-3">
        <label for="uusiSahkoposti" class="form-label">Sähköposti</label>
        <input id="uusiSahkoposti" class="form-control" type="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="uusiSalasana" class="form-label">Salasana (vähintään 8 merkkiä)</label>
        <input id="uusiSalasana" class="form-control" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="mb-3">
        <label for="vahvistaSalasana" class="form-label">Vahvista salasana</label>
        <input id="vahvistaSalasana" class="form-control" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn btn-dark" type="submit">Rekisteröidy</button>
    </form>

    <hr class="my-4">

    <h2 id="kirjaudu">Kirjaudu sisään</h2>
    <form id="kirjautumisLomake">
      <div class="mb-3">
        <label for="kirjautumisSahkoposti" class="form-label">Sähköposti</label>
        <input id="kirjautumisSahkoposti" class="form-control" type="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="kirjautumisSalasana" class="form-label">Salasana</label>
        <input id="kirjautumisSalasana" class="form-control" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-dark" type="submit">Kirjaudu sisään</button>
    </form>
    <p id="authTila" class="mt-3" role="status" aria-live="polite"></p>
  </main>
  <script src="auth.js"></script>
  <script>
    const authStatus = document.querySelector("#authTila");
    const registrationForm = document.querySelector("#rekisterointiLomake");
    const loginForm = document.querySelector("#kirjautumisLomake");

    function showAuthError(error) {
      authStatus.textContent = error.message || "Toiminto epäonnistui. Yritä uudelleen.";
      authStatus.classList.add("text-danger");
    }

    function completeLogin() {
      location.replace(Auth.destinationFromUrl());
    }

    registrationForm.addEventListener("submit", async event => {
      event.preventDefault();
      authStatus.textContent = "";
      authStatus.classList.remove("text-danger");
      const password = document.querySelector("#uusiSalasana").value;
      if (password !== document.querySelector("#vahvistaSalasana").value) {
        showAuthError(new Error("Salasanat eivät täsmää."));
        return;
      }
      try {
        await Auth.register(document.querySelector("#uusiSahkoposti").value, password);
        completeLogin();
      } catch (error) {
        showAuthError(error);
      }
    });

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      authStatus.textContent = "";
      authStatus.classList.remove("text-danger");
      try {
        await Auth.login(
          document.querySelector("#kirjautumisSahkoposti").value,
          document.querySelector("#kirjautumisSalasana").value
        );
        completeLogin();
      } catch (error) {
        showAuthError(error);
      }
    });

    try {
      if (Auth.isLoggedIn()) {
        completeLogin();
      }
    } catch (error) {
      showAuthError(error);
    }
  </script>
</body>
</html>
